<script>
/* =====================================================
   HELPDESK & LAYANAN LAPANGAN + SUPABASE
   Tabel: `ardi` (karyawan) dan `helpdesk_tickets` (tiket)
   ===================================================== */
const SUPABASE_URL = 'https://mbzrjiuhqqevsqslhjvp.supabase.co'; // URL dasar, tanpa /rest/v1/
const SUPABASE_KEY = 'sb_publishable_AanlI_T1vCdJv2oTJFLWfA_9viy1_Hf';
const T_USERS = 'ardi';
const T_TICKETS = 'helpdesk_tickets';
const SESSION_KEY = 'helpdesk_email';
const TICKET_LIMIT = 300;   // batasi jumlah tiket yang dimuat (foto disimpan base64, jadi cukup berat)
const REFRESH_MS = 30000;   // auto-refresh 30 detik

let sb = null;
try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) { console.error(e); }

/* ---------- konstanta ---------- */
const ROLE_BADGE = { admin: 'bg-violet-100 text-violet-700', kepala: 'bg-indigo-100 text-indigo-700', teknisi: 'bg-sky-100 text-sky-700' };
const STATUS_CLS = {
  Masuk:      'bg-slate-100 text-slate-700',
  Ditugaskan: 'bg-amber-100 text-amber-800',
  Proses:     'bg-indigo-100 text-indigo-800',
  Selesai:    'bg-emerald-100 text-emerald-800',
};
const STATUS_BAR = { Masuk: 'bg-slate-400', Ditugaskan: 'bg-amber-400', Proses: 'bg-indigo-500', Selesai: 'bg-emerald-500' };
const STEPS = ['Masuk', 'Ditugaskan', 'Proses', 'Selesai'];
const PRIO = {
  Darurat: { cls: 'bg-red-100 text-red-700 ring-red-200', dot: 'bg-red-500', bar: 'border-l-red-500', w: 0 },
  Sedang:  { cls: 'bg-yellow-100 text-yellow-800 ring-yellow-200', dot: 'bg-yellow-400', bar: 'border-l-yellow-400', w: 1 },
  Normal:  { cls: 'bg-blue-100 text-blue-700 ring-blue-200', dot: 'bg-blue-500', bar: 'border-l-blue-500', w: 2 },
};

/* ---------- util ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (ts) => ts ? new Date(ts).toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '-';
function rel(ts) {
  if (!ts) return '';
  const m = Math.max(0, Math.round((Date.now() - new Date(ts).getTime()) / 60000));
  if (m < 1) return 'baru saja';
  if (m < 60) return m + ' menit lalu';
  if (m < 1440) return Math.floor(m / 60) + ' jam lalu';
  return Math.floor(m / 1440) + ' hari lalu';
}
const initials = (n) => String(n || '?').split(' ').filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const norm = (s) => String(s ?? '').trim().toLowerCase();
const tno = (t) => { const s = String(t.id); return s.length > 10 ? 'T-' + s.slice(0, 6).toUpperCase() : 'T-' + s; };
const emp = (r, k) => r[k] ?? '';
const isImg = (s) => typeof s === 'string' && (s.startsWith('data:image') || /^https?:\/\//.test(s));
const icon = (name, cls = 'w-4 h-4') => `<i data-lucide="${name}" class="${cls}"></i>`;
const refreshIcons = () => { try { if (window.lucide) window.lucide.createIcons(); } catch (e) {} };
function roleOf(jabatan) {
  const j = norm(jabatan);
  if (j === 'kepala teknisi') return 'kepala';
  if (j === 'teknisi') return 'teknisi';
  if (j === 'manager operasional' || j === 'admin') return 'admin';
  return null;
}

/* ---------- state ---------- */
const S = { view: 'home', user: null, tickets: [], emps: [], loading: false, booting: false, busyLoad: false, failing: false, lastOk: true, sig: '', techTab: 'aktif', filter: 'Semua', q: '', submitted: null };
// Sub-langkah teknisi "Mulai Perjalanan" disimpan lokal di perangkat teknisi,
// karena kolom `status` hanya punya 4 nilai: Masuk/Ditugaskan/Proses/Selesai.
const stepStore = {
  get: (id) => { try { return JSON.parse(localStorage.getItem('helpdesk_step') || '{}')[id] || null; } catch (e) { return null; } },
  set: (id, v) => { try { const o = JSON.parse(localStorage.getItem('helpdesk_step') || '{}'); if (v) o[id] = v; else delete o[id]; localStorage.setItem('helpdesk_step', JSON.stringify(o)); } catch (e) {} },
};

/* ---------- UI helpers ---------- */
function toast(msg, err) {
  const t = $('toast');
  t.innerHTML = `<div class="fade-in flex items-start gap-3 ${err ? 'bg-red-600' : 'bg-slate-900'} text-white text-sm px-4 py-3 rounded-2xl shadow-2xl">
    <span class="mt-0.5 shrink-0">${icon(err ? 'circle-alert' : 'circle-check', 'w-5 h-5')}</span><span>${esc(msg)}</span></div>`;
  refreshIcons();
  clearTimeout(toast._t); toast._t = setTimeout(() => t.innerHTML = '', err ? 6000 : 2800);
}
function dbErr(e, ctx) {
  console.error(ctx, e);
  const m = (e && (e.message || e.details)) || 'Terjadi kesalahan';
  const rls = e && (e.code === '42501' || /row-level security|permission denied|RLS/i.test(m));
  const net = /failed to fetch|networkerror|load failed|network request failed/i.test(m);
  const tbl = e && (e.code === '42P01' || e.code === 'PGRST205' || /does not exist|could not find the table/i.test(m)) && !/column/i.test(m);
  const cm = /column|schema cache/i.test(m) ? m.match(/foto_profil|completed_at|feedback/) : null;
  const dup = e && (e.code === '23505' || /duplicate key/i.test(m));
  toast(rls ? `${ctx}: akses ditolak Supabase (cek kebijakan RLS tabel).`
        : net ? `${ctx}: tidak dapat terhubung ke server. Periksa koneksi internet.`
        : tbl ? `${ctx}: tabel tidak ditemukan di Supabase (cek nama tabel).`
        : cm ? `${ctx}: kolom "${cm[0]}" belum ada di tabel Supabase. Tambahkan kolom tersebut.`
        : dup ? `${ctx}: data duplikat (email atau kode karyawan sudah terdaftar).`
        : `${ctx}: ${m}`, true);
}
function openModal(html, wide) {
  pendingPhoto = null; // jangan bawa sisa foto dari form lain
  $('modal-root').innerHTML = `
  <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/50 backdrop-blur-sm p-0 sm:p-4" onclick="if(event.target===this)closeModal()">
    <div role="dialog" aria-modal="true" class="fade-in bg-white w-full ${wide ? 'sm:max-w-2xl' : 'sm:max-w-lg'} max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl shadow-2xl">${html}</div>
  </div>`;
  document.body.style.overflow = 'hidden';
  refreshIcons();
}
function closeModal() { $('modal-root').innerHTML = ''; document.body.style.overflow = ''; pendingPhoto = null; }
const modalHead = (title, sub) => `
  <div class="sticky top-0 bg-white/95 backdrop-blur flex items-start justify-between gap-3 px-5 pt-5 pb-3 border-b border-slate-100 z-10">
    <div class="min-w-0"><h3 class="text-lg font-bold">${title}</h3>${sub ? `<p class="text-sm text-slate-500">${sub}</p>` : ''}</div>
    <button onclick="closeModal()" aria-label="Tutup" class="shrink-0 w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 grid place-items-center">${icon('x', 'w-4 h-4')}</button>
  </div>`;
const prioBadge = (p) => { const x = PRIO[p] || PRIO.Normal; return `<span class="inline-flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-full ring-1 ${x.cls}"><span class="w-1.5 h-1.5 rounded-full ${x.dot}"></span>${esc(p || 'Normal')}</span>`; };
const statusBadge = (s, label) => `<span class="inline-block text-xs font-semibold px-2.5 py-1 rounded-full whitespace-nowrap ${STATUS_CLS[s] || 'bg-slate-100 text-slate-700'}">${esc(label || s)}</span>`;
const spinner = '<svg class="spin w-4 h-4" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity=".25"/><path d="M22 12a10 10 0 0 0-10-10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';
const btnP = 'inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold transition active:scale-95 bg-indigo-600 text-white hover:bg-indigo-700 shadow-lg shadow-indigo-600/20 disabled:opacity-60 disabled:cursor-not-allowed';
const btnG = 'inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold transition active:scale-95 bg-slate-100 text-slate-700 hover:bg-slate-200 disabled:opacity-60';
const inp = 'w-full rounded-xl border border-slate-300/80 bg-white/90 px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500';
const lbl = 'block text-sm font-medium text-slate-700 mb-1.5';
function setBusy(btn, busy, text) {
  if (!btn) return;
  if (busy) { btn.dataset.t = btn.innerHTML; btn.disabled = true; btn.innerHTML = spinner + (text || 'Memproses...'); }
  else { btn.disabled = false; if (btn.dataset.t) btn.innerHTML = btn.dataset.t; }
}
function stepper(status) {
  const idx = STEPS.indexOf(status);
  return `<div class="flex items-center gap-1">` + STEPS.map((s, i) =>
    `<span class="h-1.5 w-5 rounded-full ${idx >= i ? (status === 'Selesai' ? 'bg-emerald-500' : 'bg-indigo-500') : 'bg-slate-200'}"></span>`).join('') + `</div>`;
}
function avatar(foto, nama, size = 'w-9 h-9', text = 'text-sm') {
  return isImg(foto)
    ? `<img src="${esc(foto)}" alt="${esc(nama)}" class="${size} rounded-full object-cover ring-2 ring-white shadow shrink-0">`
    : `<span class="${size} ${text} rounded-full bg-gradient-to-br from-indigo-500 to-violet-500 text-white font-bold grid place-items-center ring-2 ring-white shadow shrink-0">${esc(initials(nama))}</span>`;
}
function thumb(t, field) {
  const src = t[field];
  if (!isImg(src)) return `<span class="text-xs text-slate-400">-</span>`;
  return `<button onclick="viewPhoto('${esc(t.id)}','${field}')" aria-label="Lihat foto" class="block"><img src="${esc(src)}" alt="foto" class="w-12 h-12 object-cover rounded-lg ring-1 ring-slate-200 hover:ring-indigo-400"></button>`;
}
function viewPhoto(id, field) { const t = S.tickets.find(x => String(x.id) === String(id)); if (t && isImg(t[field])) viewImg(t[field]); }
function viewImg(src) { openModal(`${modalHead('Foto')}<div class="p-4"><img src="${esc(src)}" class="w-full rounded-2xl"></div>`); }

/* ---------- foto: baca + kompres (disimpan sebagai data URL / base64) ---------- */
let pendingPhoto = null;
function readPhoto(file, max = 800, square = false) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const c = document.createElement('canvas'), ctx = c.getContext('2d');
        if (square) {
          const s = Math.min(img.width, img.height), sx = (img.width - s) / 2, sy = (img.height - s) / 2;
          c.width = c.height = Math.min(max, s);
          ctx.drawImage(img, sx, sy, s, s, 0, 0, c.width, c.height);
        } else {
          const r = Math.min(1, max / Math.max(img.width, img.height));
          c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
          ctx.drawImage(img, 0, 0, c.width, c.height);
        }
        res(c.toDataURL('image/jpeg', 0.78));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function onPhotoPick(input, previewId) {
  const f = input.files && input.files[0]; if (!f) return;
  try {
    pendingPhoto = await readPhoto(f);
    $(previewId).innerHTML = `<img src="${pendingPhoto}" class="w-full max-h-56 object-cover rounded-2xl ring-1 ring-slate-200">`;
  } catch (e) { toast('Gagal membaca foto. Coba format JPG atau PNG.', true); }
}
const photoField = (id, label, hint) => `
  <div>
    <label class="${lbl}">${label}</label>
    <label class="flex flex-col items-center justify-center gap-1 border-2 border-dashed border-slate-300 rounded-2xl py-5 cursor-pointer hover:border-indigo-400 hover:bg-indigo-50/50 text-slate-500 bg-white/50">
      ${icon('camera', 'w-6 h-6')}<span class="text-sm font-medium">Ambil / pilih foto</span><span class="text-xs">${hint || ''}</span>
      <input type="file" accept="image/*" class="hidden" onchange="onPhotoPick(this,'${id}')">
    </label>
    <div id="${id}" class="mt-3"></div>
  </div>`;

/* =====================================================
   DATA (Supabase)
   ===================================================== */
function makeSig(tickets, emps) {
  const a = tickets.map(t => [t.id, t.status, t.teknisi_email, t.prioritas, t.completed_at, (t.feedback || '').length, (t.foto_awal || '').length, (t.foto_bukti || '').length].join('|')).join(';');
  const b = (emps || []).map(r => [r.id, r['Kode Karyawan'], r.email, r['Nama'], r['Jabatan'], r['Supervisor'], (r.foto_profil || '').length].join('|')).join(';');
  return a + '#' + b;
}
async function loadData(quiet) {
  if (!sb || !S.user) return;
  if (quiet && S.busyLoad) return;
  S.busyLoad = true;
  if (!quiet) { S.loading = true; render(); }
  let changed = true, ok = true;
  try {
    let q = sb.from(T_TICKETS).select('*').order('created_at', { ascending: false }).limit(TICKET_LIMIT);
    if (S.user.role === 'teknisi') q = q.eq('teknisi_email', S.user.email);
    const tq = await q;
    if (tq.error) throw tq.error;
    let emps = null;
    if (S.user.role !== 'teknisi') {
      const eq = await sb.from(T_USERS).select('*');
      if (eq.error) throw eq.error;
      emps = eq.data || [];
    }
    if (!S.user) { S.busyLoad = false; return; } // logout saat memuat
    const sig = makeSig(tq.data || [], emps);
    changed = sig !== S.sig; S.sig = sig;
    S.tickets = tq.data || []; if (emps) S.emps = emps;
    S.failing = false;
  } catch (e) {
    ok = false; changed = false;
    if (!quiet || !S.failing) dbErr(e, quiet ? 'Auto-refresh gagal' : 'Gagal memuat data');
    S.failing = true;
  }
  S.lastOk = ok; S.loading = false; S.busyLoad = false;
  if (!quiet || changed) render();
}
async function manualRefresh() { await loadData(false); if (S.lastOk) toast('Data diperbarui'); }
// `where` = syarat tambahan agar tidak menimpa perubahan orang lain (misal status harus masih 'Masuk')
async function updateTicket(id, patch, where) {
  let q = sb.from(T_TICKETS).update(patch).eq('id', id);
  if (where) q = q.match(where);
  const { data, error } = await q.select();
  if (error) throw error;
  if (!data || !data.length) throw new Error('Tiket tidak berubah. Mungkin sudah diubah pihak lain, atau diblokir kebijakan RLS.');
  return data[0];
}
const rowToUser = (row, role) => ({ email: row.email, nama: row['Nama'] || row.email, jabatan: row['Jabatan'], kode: row['Kode Karyawan'], supervisor: row['Supervisor'], foto: row.foto_profil || null, role });
async function findEmployee(email) {
  const { data, error } = await sb.from(T_USERS).select('*').ilike('email', email.replace(/[\\%_]/g, '\\$&')).limit(5);
  if (error) throw error;
  return (data || []).find(r => norm(r.email) === norm(email)) || null;
}

/* =====================================================
   LANDING: PELAPORAN PUBLIK + LOGIN
   ===================================================== */

      <div class="flex gap-2 shrink-0">
        ${S.view !== 'home' ? `<button onclick="go('home')" class="${btnG} !py-2">Beranda</button>` : ''}

      </div>

  </header>
  <main class="max-w-5xl mx-auto px-4 py-8 pb-20 fade-in">${inner}</main>`;
}

  }
  const prio = (p, cls) => `<label class="cursor-pointer"><input type="radio" name="prio" value="${p}" class="peer sr-only" ${p === 'Normal' ? 'checked' : ''}>
    <span class="block text-center rounded-xl border py-2.5 text-sm font-bold transition ${cls}">${p}</span></label>`;
  return publicShell(`
  <div class="max-w-xl mx-auto">

async function submitReport(e) {
  e.preventDefault();
  if (!sb) return toast('Supabase SDK gagal dimuat. Periksa koneksi internet.', true);
  let last = 0; try { last = +localStorage.getItem('helpdesk_last_report') || 0; } catch (x) {}
  if (Date.now() - last < 30000) return toast('Mohon tunggu beberapa detik sebelum mengirim laporan lagi.', true);
  const btn = $('r-btn'); setBusy(btn, true, 'Mengirim...');
  const row = {
    pelanggan: $('r-nama').value.trim(),
    lokasi: $('r-lokasi').value.trim(),
    prioritas: document.querySelector('input[name=prio]:checked').value,
    keluhan: $('r-keluhan').value.trim(),
    status: 'Masuk',
    teknisi_email: null,
    foto_awal: pendingPhoto || null,
  };
  try {
    let no = null;
    const r1 = await sb.from(T_TICKETS).insert(row).select().single();
    if (r1.error) {
      // Jika hanya pembacaan-kembali yang diblokir RLS, insert dibatalkan; coba lagi tanpa select
      if (r1.error.code !== '42501') throw r1.error;
      const r2 = await sb.from(T_TICKETS).insert(row);
      if (r2.error) throw r2.error;
    } else no = tno(r1.data);
    try { localStorage.setItem('helpdesk_last_report', String(Date.now())); } catch (x) {}
    pendingPhoto = null; S.submitted = { no }; render(); window.scrollTo(0, 0);
  } catch (err) { dbErr(err, 'Gagal mengirim laporan'); setBusy(btn, false); }
}
function copyText(t) { try { navigator.clipboard.writeText(t); toast('Nomor tiket disalin'); } catch (e) { toast('Salin manual: ' + t); } }

/* ---------- login ---------- */
async function doLogin(e) {
  e.preventDefault();
  if (!sb) return toast('Supabase SDK gagal dimuat. Periksa koneksi internet.', true);
  const email = $('l-email').value.trim();
  const btn = $('l-btn'); setBusy(btn, true, 'Memeriksa...');
  try {
    const row = await findEmployee(email);
    if (!row) { setBusy(btn, false); return toast('Email tidak terdaftar sebagai karyawan', true); }
    const role = roleOf(row['Jabatan']);
    if (!role) { setBusy(btn, false); return toast(`Jabatan "${row['Jabatan']}" belum memiliki akses dashboard`, true); }
    S.user = rowToUser(row, role);
    try { localStorage.setItem(SESSION_KEY, row.email); } catch (x) {}
    S.view = 'dash'; S.techTab = 'aktif'; S.filter = 'Semua'; S.q = ''; S.sig = ''; S.tickets = []; S.emps = [];
    toast(`Selamat datang, ${S.user.nama}`);
    await loadData();
  } catch (err) { dbErr(err, 'Login gagal'); setBusy(btn, false); }
}
async function restoreSession() {
  if (!S.booting) return;
  try {
    let em = null; try { em = localStorage.getItem(SESSION_KEY); } catch (e) {}
    const row = em ? await findEmployee(em) : null;
    const role = row && roleOf(row['Jabatan']);
    if (role) { S.user = rowToUser(row, role); S.view = 'dash'; S.booting = false; await loadData(); return; }
    try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  } catch (e) { dbErr(e, 'Gagal memulihkan sesi'); }
  S.booting = false; render();
}
function logout() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  S.user = null; S.tickets = []; S.emps = []; S.sig = ''; S.view = 'home'; S.q = ''; S.filter = 'Semua'; pendingPhoto = null;
  closeModal(); render(); window.scrollTo(0, 0);
}

async function onProfilePick(input) {
  const f = input.files && input.files[0]; if (!f) return;
  try {
    pendingPhoto = await readPhoto(f, 320, true);
    $('p-prev').innerHTML = `<img src="${pendingPhoto}" class="w-28 h-28 rounded-full object-cover ring-4 ring-indigo-200 shadow">`;
  } catch (e) { toast('Gagal membaca foto. Coba format JPG atau PNG.', true); }
}
async function saveProfilePhoto(remove, btn) {
  if (!remove && !pendingPhoto) return toast('Pilih foto terlebih dahulu', true);
  const val = remove ? null : pendingPhoto;
  setBusy(btn, true, 'Menyimpan...');
  try {
    const { data, error } = await sb.from(T_USERS).update({ foto_profil: val }).eq('email', S.user.email).select();
    if (error) throw error;
    if (!data || !data.length) throw new Error('Tidak ada baris yang berubah (kemungkinan diblokir kebijakan RLS)');
    S.user.foto = val; closeModal();
    toast(remove ? 'Foto profil dihapus' : 'Foto profil diperbarui');
    if (S.user.role !== 'teknisi') await loadData(true); else render();
  } catch (e) { dbErr(e, 'Gagal menyimpan foto'); setBusy(btn, false); }
}

function fmtDur(ms) {
  const m = Math.max(0, Math.round(ms / 60000));
  if (m < 1) return 'kurang dari 1 menit';
  if (m < 60) return m + ' menit';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' jam ' + (m % 60) + ' menit';
  return Math.floor(h / 24) + ' hari ' + (h % 24) + ' jam';
}

function empFilter(r) {

async function saveEmp(e) {
  e.preventDefault();
  const cur = empEditing, btn = $('e-btn');
  const row = {
    'Kode Karyawan': $('e-kode').value.trim(),
    'Nama': $('e-nama').value.trim(),
    email: $('e-email').value.trim(),
    'Jabatan': $('e-jab').value,
    'Supervisor': $('e-spv').value.trim() || null,
  };
  const others = S.emps.filter(x => x !== cur);
  if (others.some(x => norm(x.email) === norm(row.email))) return toast('Email sudah dipakai karyawan lain', true);
  if (others.some(x => norm(x['Kode Karyawan']) === norm(row['Kode Karyawan']))) return toast('Kode Karyawan sudah dipakai karyawan lain', true);
  setBusy(btn, true, 'Menyimpan...');
  try {
    if (cur) {
      const [col, v] = empFilter(cur);
      const { data, error } = await sb.from(T_USERS).update(row).eq(col, v).select();
      if (error) throw error;
      if (!data || !data.length) throw new Error('Data tidak berubah (kemungkinan diblokir kebijakan RLS)');
      // email berubah: pindahkan tiket yang sudah ditugaskan ke email baru agar tidak yatim
      if (norm(cur.email) !== norm(row.email)) {
        const t = await sb.from(T_TICKETS).update({ teknisi_email: row.email }).eq('teknisi_email', cur.email).select('id');
        if (t.error) toast('Data tersimpan, tetapi tiket lama gagal dipindahkan ke email baru: ' + t.error.message, true);
      }
      if (isSelf(cur)) { S.user.nama = row['Nama'] || S.user.nama; S.user.kode = row['Kode Karyawan']; S.user.supervisor = row['Supervisor']; }
    } else {
      const { error } = await sb.from(T_USERS).insert(row);
      if (error) throw error;
    }
    closeModal(); toast(cur ? 'Data karyawan diperbarui' : 'Karyawan baru ditambahkan'); await loadData(true);
  } catch (err) { dbErr(err, cur ? 'Gagal menyimpan perubahan' : 'Gagal menambah karyawan'); setBusy(btn, false); }
}
function openEmpDelete(i) {
  const r = S.emps[i]; if (!r) return;

async function confirmDeleteEmp(btn) {
  const r = empEditing; if (!r) return;
  setBusy(btn, true, 'Menghapus...');
  try {
    const [col, v] = empFilter(r);
    const { data, error } = await sb.from(T_USERS).delete().eq(col, v).select();

      ${t.status === 'Selesai' ? `<div class="mt-3 rounded-xl bg-emerald-50 border border-emerald-100 p-3 text-sm"><div class="text-xs font-semibold text-emerald-700 mb-1">Selesai ${fmt(t.completed_at)}</div><p class="whitespace-pre-line text-slate-700">${esc(t.feedback) || '<span class="text-slate-400">Tanpa catatan</span>'}</p></div>` : ''}
      ${t.status !== 'Selesai' ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(t.lokasi || '')}" target="_blank" rel="noopener" class="${btnG} w-full mt-3">${icon('map', 'w-4 h-4')}Buka Peta</a>` : ''}
      ${n ? `<button onclick="advance('${esc(t.id)}','${n.key}',this)" class="mt-2 w-full inline-flex items-center justify-center gap-2 rounded-xl py-3.5 text-white font-bold text-base shadow-lg transition active:scale-95 disabled:opacity-60 ${n.cls}">${n.label}</button>` : ''}
    </article>`;
  };
  return `
  <div class="grid grid-cols-3 gap-2.5 sm:gap-4 mb-5">
    ${statCard('Tugas Baru', active.filter(t => t.status === 'Ditugaskan').length, 'bell-ring', 'bg-amber-100 text-amber-600')}
    ${statCard('Aktif', active.length, 'wrench', 'bg-indigo-100 text-indigo-600')}
    ${statCard('Selesai', done.length, 'circle-check', 'bg-emerald-100 text-emerald-600')}
  </div>
  <div class="flex gap-1.5 mb-4 bg-slate-200/60 p-1 rounded-2xl">
    ${[['aktif', `Tugas Saya (${active.length})`], ['selesai', `Riwayat (${done.length})`]].map(([k, l]) => `<button onclick="S.techTab='${k}';render()" class="flex-1 py-2.5 rounded-xl text-sm font-semibold ${S.techTab === k ? 'bg-white shadow text-indigo-700' : 'text-slate-500'}">${l}</button>`).join('')}
  </div>
  <div class="grid md:grid-cols-2 gap-3">${list.length ? list.map(card).join('') : `<div class="md:col-span-2">${emptyBox('coffee', S.techTab === 'aktif' ? 'Belum ada tugas. Tunggu penugasan dari Kepala Teknisi.' : 'Belum ada riwayat pekerjaan.')}</div>`}</div>`;
}
async function advance(id, key, btn) {
  if (key === 'selesai') return openFinish(id);
  if (key === 'berangkat') { stepStore.set(id, 'berangkat'); toast('Selamat jalan! Hati-hati di perjalanan.'); return render(); }
  if (btn) btn.disabled = true;
  try {
    await updateTicket(id, { status: 'Proses' }, { status: 'Ditugaskan', teknisi_email: S.user.email });
    stepStore.set(id, 'diterima'); toast('Tugas diterima. Status: Proses'); await loadData(true);
  } catch (e) { dbErr(e, 'Gagal menerima tugas'); if (btn) btn.disabled = false; loadData(true); }
}
function openFinish(id) {
  const t = S.tickets.find(x => String(x.id) === String(id)); if (!t) return;
  openModal(`${modalHead('Selesaikan Pekerjaan', `${tno(t)} · ${esc(t.pelanggan)}`)}
  <div class="p-5 space-y-4">
    <div><label class="${lbl}">Catatan Penyelesaian / Feedback <span class="text-red-500">*</span></label>
      <textarea id="f-note" rows="4" maxlength="1000" class="${inp}" placeholder="Apa yang diperbaiki, sparepart yang dipakai, saran untuk pelanggan..."></textarea></div>
    ${photoField('f-prev', 'Foto Bukti Perbaikan (opsional)', 'Gunakan kamera untuk memotret hasil pekerjaan')}
    <div class="flex gap-2 justify-end pt-1"><button onclick="closeModal()" class="${btnG}">Batal</button><button onclick="finish('${esc(t.id)}',this)" class="${btnP} !bg-emerald-600 hover:!bg-emerald-700 !shadow-emerald-600/20">${icon('flag', 'w-4 h-4')}Selesaikan Pekerjaan</button></div>
  </div>`);
}
async function finish(id, btn) {
  const note = $('f-note').value.trim();
  if (note.length < 5) return toast('Isi catatan penyelesaian terlebih dahulu (minimal 5 karakter)', true);
  setBusy(btn, true, 'Menyimpan...');
  try {
    await updateTicket(id, { status: 'Selesai', foto_bukti: pendingPhoto || null, feedback: note, completed_at: new Date().toISOString() }, { status: 'Proses', teknisi_email: S.user.email });
    stepStore.set(id, null); closeModal(); toast('Pekerjaan selesai. Terima kasih!'); S.techTab = 'aktif'; await loadData(true);
  } catch (e) { dbErr(e, 'Gagal menyelesaikan'); setBusy(btn, false); loadData(true); }
}

/* ---------- ROUTER / RENDER ---------- */
function render() {
  const app = $('app');
  if (S.booting) {
    app.innerHTML = `<div class="min-h-screen grid place-items-center text-slate-400"><div class="flex flex-col items-center gap-3">${spinner}<span class="text-sm">Memulihkan sesi...</span></div></div>`;
    return;
  }
  // simpan kondisi input agar auto-refresh tidak mengganggu pengguna
  const keep = {}; app.querySelectorAll('select[id^="qa-"]').forEach(s => { if (s.value) keep[s.id] = s.value; });
  const ae = document.activeElement, hadFocus = ae && ae.id === 'mon-q', pos = hadFocus ? ae.selectionStart : null;
  const scrollY = window.scrollY;
  const inDash = !!(S.user && S.view === 'dash');
  if (inDash) {
    if (S.loading && !S.tickets.length) {
      app.innerHTML = dashShell(`<div class="py-24 text-center text-slate-400 flex flex-col items-center gap-3">${spinner}Memuat data dari Supabase...</div>`, 0);
      refreshIcons(); return;
    }
    let body, badge = 0;
    if (S.user.role === 'admin') body = adminView();
    else if (S.user.role === 'kepala') { body = kepalaView(); badge = S.tickets.filter(t => t.status === 'Masuk').length; }
    else { body = teknisiView(); badge = S.tickets.filter(t => t.status === 'Ditugaskan').length; }
    app.innerHTML = dashShell(body, badge);
  } else {
    app.innerHTML = S.view === 'lapor' ? laporView() : S.view === 'login' ? loginView() : homeView();
  }
  Object.keys(keep).forEach(id => { const el = $(id); if (el) el.value = keep[id]; });
  renderMonitor();
  refreshIcons();
  if (hadFocus) { const el = $('mon-q'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} } }
  const key = inDash ? 'dash' : 'v-' + S.view + (S.submitted ? '-ok' : '');
  if (render._k === key) window.scrollTo(0, scrollY);
  render._k = key;
}

// Auto-refresh tiap 30 detik saat dashboard terbuka, tab terlihat, dan tidak ada modal
setInterval(() => { if (S.user && S.view === 'dash' && !document.hidden && !$('modal-root').innerHTML) loadData(true); }, REFRESH_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.user && S.view === 'dash' && !$('modal-root').innerHTML) loadData(true); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('modal-root').innerHTML) closeModal(); });

window.addEventListener('load', () => {
  if (!sb) toast('Supabase SDK gagal dimuat. Periksa koneksi internet.', true);
  let has = false; try { has = !!localStorage.getItem(SESSION_KEY); } catch (e) {}
  S.booting = !!(has && sb);
  render(); restoreSession();
});
</script>
</body>
</html>
